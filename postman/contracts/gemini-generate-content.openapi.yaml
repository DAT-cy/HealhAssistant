openapi: 3.0.3
info:
  title: Gemini Generate Content API (test contract)
  version: 1.0.0
servers:
  - url: https://generativelanguage.googleapis.com/v1beta
paths:
  /models/{model}:generateContent:
    post:
      operationId: generateContent
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Generated text response
          content:
            application/json:
              schema:
                type: object
              example:
                candidates:
                  - content:
                      parts:
                        - text: '{"message":"Bắt đầu với vận động vừa sức và tăng dần theo thể trạng.","safetyEscalation":false}'
                    finishReason: STOP
