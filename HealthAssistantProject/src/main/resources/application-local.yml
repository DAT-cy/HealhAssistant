server:
  port: 8081

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/health_assistant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.base_springboot.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-must-be-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta
google:
  oauth:
    # Backend only verifies ID tokens whose aud claim matches this Web OAuth client.
    # Set GOOGLE_OAUTH_CLIENT_IDS to a comma-separated list when supporting more clients.
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}

cloudinary:
  api-key: 653961144944774
  api-secet: x3_Zif3Vr_pqcZMW0WM69jR2x8I
